version: '3.8'

services:
  # Service Backend API
  backend:
    build: 
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: user_dashboard
      DATABASE_PASSWORD: secure_password
      DATABASE_NAME: dashboard_data
      JWT_SECRET: votre_secret_jwt_a_changer
      NODE_ENV: development
    volumes:
      - ./src/backend:/app
      - /app/node_modules

  # Service Frontend
  frontend:
    build: 
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:5000

  # Service PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: dashboard_db
    restart: always
    environment:
      POSTGRES_USER: user_dashboard
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: dashboard_data
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local